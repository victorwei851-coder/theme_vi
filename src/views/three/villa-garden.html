<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>岚庭 · 自然庭院别墅</title>
<style>
  :root { color-scheme: light; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #dce8e2; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; color: #29372f; }
  #app { width: 100vw; height: 100vh; }
  .panel { background: rgba(250, 250, 246, .82); border: 1px solid rgba(255,255,255,.72); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 12px 36px rgba(42,55,45,.12); }
  .info { position: fixed; top: 22px; left: 22px; padding: 18px 21px 16px; border-radius: 18px; user-select: none; pointer-events: none; }
  .eyebrow { font-size: 10px; letter-spacing: .24em; color: #78877b; margin-bottom: 7px; }
  .info h1 { font-family: "Songti SC", "Noto Serif SC", serif; font-size: 23px; font-weight: 600; letter-spacing: .08em; }
  .info p { margin-top: 8px; font-size: 12px; color: #68776c; line-height: 1.7; }
  .tags { display: flex; gap: 6px; margin-top: 12px; }
  .tags span { font-size: 10px; padding: 4px 8px; border-radius: 20px; color: #53685a; background: rgba(97,125,103,.09); }
  .light-label { position: fixed; top: 25px; right: 25px; padding: 9px 13px; border-radius: 30px; font-size: 11px; letter-spacing: .08em; color: #647267; user-select: none; pointer-events: none; }
  .light-dot { display: inline-block; width: 6px; height: 6px; margin-right: 7px; border-radius: 50%; background: #d9a75f; box-shadow: 0 0 0 4px rgba(217,167,95,.14); vertical-align: 1px; }
  .views { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; gap: 5px; padding: 6px; border-radius: 16px; }
  .views button { border: 0; border-radius: 11px; padding: 10px 16px; background: transparent; color: #637168; font-family: inherit; font-size: 12px; cursor: pointer; transition: .2s ease; white-space: nowrap; }
  .views button:hover { color: #263b2d; background: rgba(255,255,255,.62); }
  .views button.active { color: #f8faf7; background: #506b58; box-shadow: 0 4px 12px rgba(50,75,58,.22); }
  .hint { position: fixed; left: 24px; bottom: 26px; font-size: 11px; color: rgba(43,57,47,.62); user-select: none; pointer-events: none; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #e7eee8; z-index: 10; transition: opacity .55s ease; }
  #loading.hide { opacity: 0; pointer-events: none; }
  .loader { text-align: center; color: #53675a; font-size: 12px; letter-spacing: .15em; }
  .loader::before { content: ""; display: block; width: 32px; height: 32px; margin: 0 auto 15px; border: 2px solid rgba(80,107,88,.18); border-top-color: #506b58; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 700px) {
    .info { top: 12px; left: 12px; padding: 13px 15px; }
    .info h1 { font-size: 18px; }
    .info p, .tags, .light-label, .hint { display: none; }
    .views { bottom: 14px; }
    .views button { padding: 9px 11px; font-size: 11px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="loading"><div class="loader">正在营造庭院</div></div>
<section class="info panel">
  <div class="eyebrow">COURTYARD RESIDENCE</div>
  <h1>岚庭 · 山野别墅</h1>
  <p>暖石立面与陶瓦屋顶，融入花境、林荫和一方茶亭。</p>
  <div class="tags"><span>精细建筑</span><span>自然庭院</span><span>林下茶歇</span></div>
</section>
<div class="light-label panel"><span class="light-dot"></span>午后自然光</div>
<nav class="views panel" aria-label="场景视角">
  <button class="active" data-view="overview">庭院全景</button>
  <button data-view="house">建筑细节</button>
  <button data-view="garden">花境漫步</button>
  <button data-view="tea">茶亭休憩</button>
  <button id="rotate">环绕</button>
</nav>
<div class="hint">左键旋转 · 滚轮缩放 · 右键平移</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Sky } from 'three/addons/objects/Sky.js';

/* 基础场景 */
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xcbd9d7, 72, 170);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, .1, 450);
camera.position.set(37, 25, 43);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = .93;
document.getElementById('app').appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = .065;
controls.target.set(0, 3.8, -2);
controls.minDistance = 7;
controls.maxDistance = 105;
controls.maxPolarAngle = Math.PI / 2.04;
controls.autoRotateSpeed = .45;

/* 可复现的随机数 */
let seed = 20261102;
function rnd() { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }
function rand(a, b) { return a + (b - a) * rnd(); }

/* 程序化自然材质 */
function canvasTexture(kind, size = 256) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const bases = { grass: '#6f7f58', plaster: '#ded5c2', stone: '#b9ae98', roof: '#9a5744', wood: '#79543b', bark: '#5c4b3b', gravel: '#bcb4a4', soil: '#62513d' };
  ctx.fillStyle = bases[kind] || '#aaaaaa';
  ctx.fillRect(0, 0, size, size);
  if (kind === 'roof') {
    for (let y = 0; y < size; y += 24) {
      const offset = (y / 24) % 2 ? 12 : 0;
      for (let x = -24; x < size + 24; x += 24) {
        const v = Math.floor(rand(-13, 14));
        ctx.fillStyle = `rgb(${151 + v},${82 + v * .55},${61 + v * .35})`;
        ctx.fillRect(x + offset + 1, y + 1, 22, 21);
        ctx.strokeStyle = 'rgba(71,38,29,.32)';
        ctx.strokeRect(x + offset + 1, y + 1, 22, 21);
        ctx.fillStyle = 'rgba(255,220,190,.10)';
        ctx.fillRect(x + offset + 3, y + 3, 2, 16);
      }
    }
  } else if (kind === 'wood') {
    for (let x = 0; x < size; x += 32) {
      ctx.fillStyle = x % 64 ? 'rgba(45,24,13,.08)' : 'rgba(255,224,181,.05)';
      ctx.fillRect(x, 0, 30, size);
      ctx.strokeStyle = 'rgba(44,25,15,.28)';
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, size); ctx.stroke();
      for (let i = 0; i < 12; i++) {
        ctx.strokeStyle = 'rgba(48,28,17,.12)';
        ctx.beginPath();
        const xx = x + rand(3, 28), yy = rand(0, size);
        ctx.moveTo(xx, yy); ctx.bezierCurveTo(xx + 5, yy + 12, xx - 4, yy + 28, xx + 2, yy + 43); ctx.stroke();
      }
    }
  } else if (kind === 'bark') {
    for (let x=0;x<size;x+=9) {
      ctx.strokeStyle = `rgba(30,22,16,${rand(.12,.32)})`;
      ctx.lineWidth = rand(1,3);
      ctx.beginPath(); ctx.moveTo(x+rand(-2,2),0);
      for(let y=0;y<size;y+=18) ctx.lineTo(x+Math.sin(y*.08+x)*rand(1,3),y);
      ctx.stroke();
    }
    for(let i=0;i<45;i++) {
      ctx.strokeStyle='rgba(205,183,146,.12)';
      ctx.beginPath(); const y=rand(0,size); ctx.moveTo(rand(0,size*.3),y); ctx.lineTo(rand(size*.6,size),y+rand(-3,3)); ctx.stroke();
    }
  } else if (kind === 'stone') {
    ctx.strokeStyle = 'rgba(83,75,61,.22)'; ctx.lineWidth = 2;
    for (let y = 0; y < size; y += 42) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(size, y); ctx.stroke();
      const off = (y / 42) % 2 ? 35 : 0;
      for (let x = off; x < size; x += 70) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 42); ctx.stroke(); }
    }
  }
  const dots = kind === 'grass' ? 5200 : 1900;
  for (let i = 0; i < dots; i++) {
    const light = rnd() > .48;
    ctx.fillStyle = light ? `rgba(255,255,235,${rand(.015,.09)})` : `rgba(24,34,20,${rand(.015,.10)})`;
    const x = rnd() * size, y = rnd() * size;
    if (kind === 'grass') {
      ctx.strokeStyle = ctx.fillStyle; ctx.beginPath(); ctx.moveTo(x, y + 3); ctx.lineTo(x + rand(-1,1), y); ctx.stroke();
    } else ctx.fillRect(x, y, rand(.4, 2), rand(.4, 2));
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return t;
}
const textures = {};
for (const k of ['grass','plaster','stone','roof','wood','bark','gravel','soil']) textures[k] = canvasTexture(k, 512);
textures.grass.repeat.set(28, 28);
textures.plaster.repeat.set(3, 2);
textures.stone.repeat.set(3, 2);
textures.roof.repeat.set(5, 4);
textures.wood.repeat.set(2, 2);
textures.bark.repeat.set(2, 5);
textures.gravel.repeat.set(8, 8);
textures.soil.repeat.set(3, 3);

function waterNormalTexture() {
  const c=document.createElement('canvas'); c.width=c.height=256;
  const ctx=c.getContext('2d'),img=ctx.createImageData(256,256);
  for(let y=0;y<256;y++) for(let x=0;x<256;x++) {
    const i=(y*256+x)*4;
    img.data[i]=128+Math.sin(x*.19+y*.07)*17+Math.sin(x*.047-y*.11)*9;
    img.data[i+1]=128+Math.cos(y*.16-x*.06)*16+Math.sin(y*.05+x*.09)*8;
    img.data[i+2]=242; img.data[i+3]=255;
  }
  ctx.putImageData(img,0,0);
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(4,4); return t;
}
const waterNormal=waterNormalTexture();

function standard(color, opts = {}) { return new THREE.MeshStandardMaterial({ color, roughness: .82, metalness: 0, envMapIntensity: .45, ...opts }); }
const M = {
  grass: standard(0xf0f2e9, { map: textures.grass, bumpMap: textures.grass, bumpScale: .045, roughness: 1 }),
  wall: standard(0xffffff, { map: textures.plaster, bumpMap: textures.plaster, bumpScale: .032, roughness: .94 }),
  wallWarm: standard(0xe6d9c5, { map: textures.plaster, bumpMap: textures.plaster, bumpScale: .028, roughness: .95 }),
  stone: standard(0xf2eee5, { map: textures.stone, bumpMap: textures.stone, bumpScale: .065, roughness: .93 }),
  stoneLight: standard(0xd8cfbd, { roughness: .9 }),
  stoneDark: standard(0x817b6e, { roughness: .98 }),
  roof: standard(0xffffff, { map: textures.roof, bumpMap: textures.roof, bumpScale: .085, roughness: .86 }),
  roofDark: standard(0x5c4136, { roughness: .9 }),
  wood: standard(0xffffff, { map: textures.wood, bumpMap: textures.wood, bumpScale: .055, roughness: .76 }),
  woodDark: standard(0x766454, { map: textures.wood, bumpMap: textures.wood, bumpScale: .045, roughness: .82 }),
  metal: standard(0x303633, { metalness: .78, roughness: .3, envMapIntensity: .9 }),
  brass: standard(0xb69352, { metalness: .82, roughness: .24, envMapIntensity: 1.1 }),
  glass: new THREE.MeshPhysicalMaterial({ color: 0x9fb5b7, roughness: .065, metalness: .08, transparent: true, opacity: .82, clearcoat: 1, clearcoatRoughness: .04, envMapIntensity: 1.35 }),
  darkGlass: standard(0x243537, { roughness: .15, metalness: .25, envMapIntensity: 1 }),
  curtain: standard(0xd8cbb5, { roughness: 1 }),
  gravel: standard(0xf0ede6, { map: textures.gravel, bumpMap: textures.gravel, bumpScale: .075, roughness: 1 }),
  soil: standard(0xd6cabb, { map: textures.soil, bumpMap: textures.soil, bumpScale: .06, roughness: 1 }),
  bark: standard(0xe0d5c7, { map: textures.bark, bumpMap: textures.bark, bumpScale: .12, roughness: 1 }),
  leaf: [standard(0x3e5938), standard(0x4d6840), standard(0x5c7348), standard(0x314b34)],
  blossom: [standard(0xd6a4a7), standard(0xe3bebc), standard(0xc98594)],
  white: standard(0xe8e3d8),
  cushion: standard(0xbfb39d, { roughness: 1 }),
  terracotta: standard(0x9a664d, { roughness: .9 }),
  lamp: standard(0xffe2a2, { emissive: 0xffc66f, emissiveIntensity: .65 }),
  water: new THREE.MeshPhysicalMaterial({ color: 0x4b858a, roughness: .075, metalness: .12, transparent: true, opacity: .88, clearcoat: 1, clearcoatRoughness: .035, normalMap: waterNormal, normalScale: new THREE.Vector2(.23,.23), ior: 1.333, envMapIntensity: 1.45 }),
  poolTile: standard(0x6e9491, { roughness: .38 }),
};

function addMesh(geo, material, parent = scene, x = 0, y = 0, z = 0, shadows = true) {
  const m = new THREE.Mesh(geo, material);
  m.position.set(x, y, z);
  m.castShadow = shadows;
  m.receiveShadow = shadows;
  parent.add(m);
  return m;
}
function box(w, h, d, material, parent = scene, x = 0, y = 0, z = 0) { return addMesh(new THREE.BoxGeometry(w,h,d), material, parent, x,y,z); }
function cyl(rt, rb, h, material, parent = scene, x = 0, y = 0, z = 0, seg = 16) { return addMesh(new THREE.CylinderGeometry(rt,rb,h,seg), material, parent, x,y,z); }
function ball(r, material, parent = scene, x = 0, y = 0, z = 0, detail = 1) { return addMesh(new THREE.IcosahedronGeometry(r,detail), material, parent, x,y,z); }
function beamBetween(a, b, radius, material, parent = scene, segments = 8) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const m = addMesh(new THREE.CylinderGeometry(radius * .78, radius, dir.length(), segments), material, parent);
  m.position.copy(a).add(b).multiplyScalar(.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.normalize());
  return m;
}

/* 天空与午后光照 */
const sky = new Sky();
sky.scale.setScalar(400);
scene.add(sky);
sky.material.uniforms.turbidity.value = 2.8;
sky.material.uniforms.rayleigh.value = 2.15;
sky.material.uniforms.mieCoefficient.value = .0035;
sky.material.uniforms.mieDirectionalG.value = .78;
const sun = new THREE.DirectionalLight(0xffe7c7, 2.25);
sun.position.set(-32, 43, 28);
sun.castShadow = true;
sun.shadow.mapSize.set(4096, 4096);
sun.shadow.camera.left = -48; sun.shadow.camera.right = 48;
sun.shadow.camera.top = 48; sun.shadow.camera.bottom = -48;
sun.shadow.camera.near = 1; sun.shadow.camera.far = 130;
sun.shadow.bias = -.00015; sun.shadow.normalBias = .035;
scene.add(sun);
sky.material.uniforms.sunPosition.value.copy(sun.position);
scene.add(new THREE.HemisphereLight(0xd7e5ef, 0x62644e, 1.08));
const fill = new THREE.DirectionalLight(0xc9dded, .34);
fill.position.set(24, 18, -30); scene.add(fill);
const pmrem=new THREE.PMREMGenerator(renderer);
const environment=pmrem.fromScene(scene,.055,.1,500);
scene.environment=environment.texture;
pmrem.dispose();

/* 草地基底 */
const ground = addMesh(new THREE.CircleGeometry(105, 96), M.grass, scene, 0, -.08, 0);
ground.rotation.x = -Math.PI / 2;
ground.castShadow = false;
const courtyard = box(62, .12, 56, M.grass, scene, 0, -.01, 0);
courtyard.castShadow = false;

/* 建筑工具 */
function hipRoof(w, d, y, h, parent, x = 0, z = 0) {
  const r = Math.max(0, (w - d) / 2);
  const V = [
    [-w/2,y,d/2],[w/2,y,d/2],[r,y+h,0], [-w/2,y,d/2],[r,y+h,0],[-r,y+h,0],
    [w/2,y,-d/2],[-w/2,y,-d/2],[-r,y+h,0], [w/2,y,-d/2],[-r,y+h,0],[r,y+h,0],
    [-w/2,y,-d/2],[-w/2,y,d/2],[-r,y+h,0], [w/2,y,d/2],[w/2,y,-d/2],[r,y+h,0]
  ];
  const pos = [], uv = [];
  for (const v of V) { pos.push(...v); uv.push(v[0]/w+.5, v[2]/d+.5); }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv,2));
  geo.computeVertexNormals();
  const roofMat = M.roof.clone(); roofMat.side = THREE.DoubleSide;
  const g = new THREE.Group(); g.position.set(x,0,z); parent.add(g);
  addMesh(geo, roofMat, g);
  box(w+.12,.18,.16,M.roofDark,g,0,y-.04,d/2);
  box(w+.12,.18,.16,M.roofDark,g,0,y-.04,-d/2);
  box(.16,.18,d+.12,M.roofDark,g,w/2,y-.04,0);
  box(.16,.18,d+.12,M.roofDark,g,-w/2,y-.04,0);
  for (const s of [-1,1]) {
    const gutter = cyl(.065,.065,w+.25,M.metal,g,0,y-.14,s*(d/2+.06),10); gutter.rotation.z = Math.PI/2;
    const sideGutter = cyl(.065,.065,d+.25,M.metal,g,s*(w/2+.06),y-.14,0,10); sideGutter.rotation.x = Math.PI/2;
  }
  if (r > .1) { const ridge = cyl(.13,.13,r*2+.35,M.roofDark,g,0,y+h+.06,0,12); ridge.rotation.z = Math.PI/2; }
  return g;
}
function createWindow(w = 1.45, h = 1.75, shutters = false, flowers = false) {
  const g = new THREE.Group();
  box(w+.24,h+.24,.16,M.stoneLight,g,0,0,0);
  box(w,h,.19,M.darkGlass,g,0,0,.07);
  box(w-.15,h-.15,.08,M.glass,g,0,0,.18);
  box(.065,h-.08,.12,M.white,g,0,0,.25);
  box(w-.08,.065,.12,M.white,g,0,.08,.25);
  box(w+.38,.13,.36,M.stoneLight,g,0,-h/2-.14,.07);
  box(w+.32,.12,.26,M.stoneLight,g,0,h/2+.13,.03);
  if (shutters) {
    for (const s of [-1,1]) {
      const sg = new THREE.Group(); sg.position.set(s*(w/2+.38),0,.03); g.add(sg);
      box(.5,h+.05,.1,M.woodDark,sg);
      for (let i=0;i<8;i++) { const slat=box(.42,.055,.08,M.wood,sg,0,-h/2+.16+i*(h-.25)/7,.08); slat.rotation.x=.18; }
    }
  }
  if (flowers) {
    box(w*.9,.25,.34,M.terracotta,g,0,-h/2-.34,.28);
    for (let i=0;i<7;i++) {
      const f=ball(.13,M.leaf[i%M.leaf.length],g,-w*.36+i*w*.12,-h/2-.16,.31,1);
      f.scale.set(1,.75,1);
      if(i%2===0) ball(.065,M.blossom[i%3],g,-w*.36+i*w*.12,-h/2-.04,.34,1);
    }
  }
  return g;
}
function placeWindow(parent,x,y,z,rot=0,w=1.45,h=1.75,shutters=false,flowers=false) {
  const g=createWindow(w,h,shutters,flowers); g.position.set(x,y,z); g.rotation.y=rot; parent.add(g); return g;
}
function quoins(parent,w,d,y0,height) {
  for (const sx of [-1,1]) for (const sz of [-1,1]) {
    for (let i=0;i<Math.floor(height/.43);i++) {
      const wide=i%2===0;
      box(wide?.58:.38,.32,.18,M.stoneLight,parent,sx*(w/2-.18),y0+.25+i*.43,sz*(d/2+.055));
      box(.18,.32,wide?.38:.58,M.stoneLight,parent,sx*(w/2+.055),y0+.25+i*.43,sz*(d/2-.18));
    }
  }
}

/* 三层别墅：统一暖石、灰泥和陶瓦 */
const house = new THREE.Group(); house.position.z = -4.5; scene.add(house);
const h1=3.15,h2=3,h3=2.75,base=.45,roofY=base+h1+h2+h3;
box(14.5,.5,10.5,M.stone,house,0,.25,0);
box(14,h1,10,M.wall,house,0,base+h1/2,0);
box(12.8,h2,8.8,M.wallWarm,house,0,base+h1+h2/2,0);
box(10,h3,6,M.wall,house,0,base+h1+h2+h3/2,0);
box(14.35,.2,10.35,M.stoneLight,house,0,base+h1-.04,0);
box(13.15,.22,9.15,M.stoneLight,house,0,base+h1+h2-.03,0);
box(14.6,.24,10.6,M.stoneLight,house,0,roofY-.1,0);
quoins(house,14,10,base,h1);
quoins(house,12.8,8.8,base+h1,h2);
quoins(house,10,6,base+h1+h2,h3);
hipRoof(15.2,11.2,roofY,2.75,house);

/* 主入口：门扇、门环、门廊、台阶 */
box(2.15,2.85,.22,M.stoneLight,house,0,1.75,5.08);
box(1.72,2.6,.18,M.woodDark,house,0,1.68,5.23);
for(const x of [-.43,.43]) for(const y of [1.05,1.95]) box(.62,.66,.08,M.wood,house,x,y,5.34);

/* 透明叶片纹理与实例化枝叶，替代球状卡通树冠 */
function foliageMaterial(flowering=false) {
  const c=document.createElement('canvas'); c.width=c.height=256;
  const ctx=c.getContext('2d');
  for(let i=0;i<260;i++) {
    const a=rnd()*Math.PI*2,r=Math.sqrt(rnd())*112;
    const x=128+Math.cos(a)*r,y=128+Math.sin(a)*r;
    const hue=rand(76,103),sat=rand(20,38),light=rand(20,39);
    ctx.fillStyle=`hsl(${hue},${sat}%,${light}%)`;
    ctx.beginPath(); ctx.ellipse(x,y,rand(4,10),rand(1.6,3.8),rand(0,Math.PI),0,Math.PI*2); ctx.fill();
    if(i%4===0) {
      ctx.strokeStyle='rgba(210,220,165,.18)'; ctx.lineWidth=.55;
      ctx.beginPath(); ctx.moveTo(x-3,y); ctx.lineTo(x+3,y); ctx.stroke();
    }
  }
  if(flowering) for(let i=0;i<52;i++) {
    const a=rnd()*Math.PI*2,r=Math.sqrt(rnd())*105,x=128+Math.cos(a)*r,y=128+Math.sin(a)*r;
    for(let p=0;p<5;p++) {
      const pa=p/5*Math.PI*2;
      ctx.fillStyle=p%2?'rgba(224,164,174,.94)':'rgba(239,195,196,.95)';
      ctx.beginPath(); ctx.ellipse(x+Math.cos(pa)*2.4,y+Math.sin(pa)*2.4,2.7,1.8,pa,0,Math.PI*2); ctx.fill();
    }
    ctx.fillStyle='rgba(211,183,113,.95)'; ctx.beginPath(); ctx.arc(x,y,1.2,0,Math.PI*2); ctx.fill();
  }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace;
  t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
  return new THREE.MeshStandardMaterial({map:t,alphaTest:.3,side:THREE.DoubleSide,shadowSide:THREE.DoubleSide,roughness:.94,metalness:0,envMapIntensity:.28});
}

}
for(let i=0;i<5;i++) {
  const vine=leafCloud(28,.85,.28,.65,i%2===0); vine.position.set(-1.8+i*.9,4.03,rand(-1.4,1.4)); tea.add(vine);
}

/* 围栏：矮石墙、铁艺和入口门柱 */
function fenceSegment(x1,z1,x2,z2) {
  const dx=x2-x1,dz=z2-z1,len=Math.hypot(dx,dz),angle=-Math.atan2(dz,dx);
  const g=new THREE.Group(); g.position.set((x1+x2)/2,0,(z1+z2)/2); g.rotation.y=angle; scene.add(g);
  box(len,.52,.34,M.stone,g,0,.26,0);
  box(len,.09,.44,M.stoneLight,g,0,.56,0);
  box(len,.055,.055,M.metal,g,0,1.25,0);
  box(len,.045,.045,M.metal,g,0,.78,0);
  const n=Math.floor(len/.46);
  for(let i=0;i<=n;i++) box(.035,.7,.035,M.metal,g,-len/2+i*len/n,.93,0);
  const piers=Math.floor(len/4);
  for(let i=0;i<=piers;i++) {
    const x=-len/2+i*len/piers;
    box(.5,1.35,.5,M.stone,g,x,.675,0);
    box(.65,.12,.65,M.stoneLight,g,x,1.39,0);
  }
}
fenceSegment(-31,-28,31,-28); fenceSegment(-31,-28,-31,28); fenceSegment(31,-28,31,28);
fenceSegment(-31,28,-4.4,28); fenceSegment(4.4,28,7.1,28); fenceSegment(13.4,28,31,28);

}

/* 细碎草叶，增强近景自然度 */
const grassPositions=[];
for(let i=0;i<2600;i++) {
  const x=rand(-30,30),z=rand(-27,27);
  const blocked=(Math.abs(x)<8&&z>-11&&z<2)||(x>-21&&x<-7&&z>-8&&z<4)||(Math.abs(x)<2.5&&z>1)||(x>7&&x<13.5&&z>0)||(Math.hypot(x-15,z-10.5)<4.5);
  if(!blocked) grassPositions.push([x,z]);
}
const grassBlades=new THREE.InstancedMesh(new THREE.ConeGeometry(.025,.32,3),standard(0x6f8952),grassPositions.length);
grassPositions.forEach((p,i)=>{
  dummy.position.set(p[0],.15,p[1]); dummy.scale.set(rand(.7,1.4),rand(.55,1.45),rand(.7,1.4)); dummy.rotation.set(rand(-.12,.12),rnd()*6.28,rand(-.12,.12)); dummy.updateMatrix(); grassBlades.setMatrixAt(i,dummy.matrix);
});
grassBlades.castShadow=false; grassBlades.receiveShadow=true; scene.add(grassBlades);

/* 视角切换 */
const views={
  overview:{p:[37,25,43],t:[0,3.8,-2]},
  house:{p:[21,14,23],t:[0,5,-3]},
  garden:{p:[-24,10,24],t:[-7,2.2,7]},
  tea:{p:[23,8,20],t:[15,1.8,10.5]}
};
let tween=null;
document.querySelectorAll('[data-view]').forEach(btn=>btn.addEventListener('click',()=>{
  document.querySelectorAll('[data-view]').forEach(b=>b.classList.remove('active')); btn.classList.add('active');
  const v=views[btn.dataset.view];
  tween={start:performance.now(),fromP:camera.position.clone(),toP:new THREE.Vector3(...v.p),fromT:controls.target.clone(),toT:new THREE.Vector3(...v.t)};
  controls.autoRotate=false; document.getElementById('rotate').classList.remove('active');
}));
document.getElementById('rotate').addEventListener('click',e=>{
  controls.autoRotate=!controls.autoRotate; e.currentTarget.classList.toggle('active',controls.autoRotate); tween=null;
});
controls.addEventListener('start',()=>{tween=null;});

/* 动画与响应式 */
const clock=new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  M.water.opacity=.86+Math.sin(t*.9)*.018;
  waterNormal.offset.x=(t*.012)%1; waterNormal.offset.y=(t*.008)%1;
  swayCrowns.forEach(s=>{s.g.rotation.z=Math.sin(t*.65+s.phase)*s.amount;s.g.rotation.x=Math.cos(t*.5+s.phase)*s.amount*.6;});
  if(tween) {
    const u=Math.min(1,(performance.now()-tween.start)/1250),e=1-Math.pow(1-u,3);
    camera.position.lerpVectors(tween.fromP,tween.toP,e); controls.target.lerpVectors(tween.fromT,tween.toT,e);
    if(u===1) tween=null;
  }
  controls.update();
  renderer.render(scene,camera);
}
animate();
requestAnimationFrame(()=>document.getElementById('loading').classList.add('hide'));
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight);
});
</script>
